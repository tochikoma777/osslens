name: 路径 B 自动链（批次 A 静态落地）

# 路径 B / 全链路自动化：三段各自定时独立跑，彼此无 needs 依赖（不构成 ①–⑧ 编排器）。
#   · auto-analyze  —— 自动深挖：读 depth.auto_default（S1'）、A1 取首个候选、C1.4 归因
#   · auto-abstract —— 独立定时跑：沿用「簇内样本达标」判据，insufficient_samples 如实空态
#   · auto-site     —— 独立定时跑：site --check --strict（只比对不写盘；有漂移退出 1）
# ★ 定时 cron：`0 11 * * *`（UTC）。GitHub 调度有排队延迟，实测首个 event=schedule
#   run 的 created_at = 2026-11-14T16:56:51Z（北京 00:56，落 DeepSeek 低谷时段），
#   故保留该 cron 不改；是否命中低谷以 costs.jsonl 的真实调用时间为准，不按名义 cron 推断。
# ★ 频率闸门：schedule 只是「低成本检查闹钟」——到点先读 config.yaml 的
#   auto_chain.min_interval_days（默认 7 = 每周一次），未满即 [skip] interval not reached。
#   分析段与抽象段**各自独立判断**（不同 purpose 锚点，互不占用）；
#   判断先于真实调用 / 真源回写 / 站点重建，不调模型、不写 call 行、不提交。
#   workflow_dispatch 只绕过本间隔检查，不绕过成本闸门（--auto-chain / 配额 / 预算 / 次数 / 系数）。
# ★ 上线状态（2026-11-16）：cron 已启用（D50 / Q3）、真源已 push main；11-14 / 11-15 / 11-16
#   三次 event=schedule run 均 success（见 `docs/开发日志.md`、`CODEBUDDY.md` §9）。
#   自动链的真实 LLM 调用仍受 7 天间隔闸门约束，间隔未满的分析段 step 显示 skipped。
# ★ 凭据写法（1.3 更正）：config.yaml 用 api_key_env / base_url_env 两个「环境变量名」
#   （不是 ${...} 占位符）；保持变量名不动，CI 只把 secrets.* 注入到这两个变量，零打印零入库。
# ★ 守门组件前置（1.3 更正）：预算闸门 / 降级双写 / 只标注不阻断的异常判定 / 报告头部醒目区块
#   这些「守门组件」前置；主动通知（Actions 告警 / 外部通知）与站点红色徽标以后再做，不取消。
# ★ 缺凭据按 config 降级 off / 退出码 0 是合法终态。

on:
  schedule:
    - cron: "0 11 * * *"   # 候选值 / 待首次 event=schedule run 的 created_at 实测校准
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osslens-auto
  cancel-in-progress: false

jobs:
  auto-analyze:
    # 红线 #25：固定 ubuntu-24.04，不用 ubuntu-latest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 仅本段需要回写真源（reports/costs/featcards + 重建 site）；abstract/site 段保持只读。
    permissions:
      contents: write
    steps:
      - name: 检出
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装 osslens
        run: pip install -e .
      - name: 频率闸门（schedule 检查真实分析间隔；workflow_dispatch 只绕过间隔）
        id: interval
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from osslens.config import Config
          from osslens.depth import (
              AUTO_ANALYSIS_PURPOSES,
              auto_interval_reached,
              load_events,
          )
          from osslens.util import SystemClock

          config = Config.load(Path("."))
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          reached = auto_interval_reached(
              config,
              load_events(config.layout),
              now=SystemClock().now(),
              purposes=AUTO_ANALYSIS_PURPOSES,
          )
          # ★ 只在 schedule 时裁决间隔；workflow_dispatch 仅供手动真实验证，
          #   只绕过间隔，后续仍必须走 --auto-chain 的成本闸门。
          if event == "schedule" and not reached:
              print(
                  "[skip] interval not reached"
                  f"（analysis, min_interval_days={config.auto_chain.min_interval_days}）"
              )
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write("skip=true\n")
          else:
              print(f"[gate] event={event} interval_reached={reached}")
          PY

      - name: 自动 analyze（A1 首个候选 / S1' 读 auto_default / C1.4 归因 / 零打印凭据）
        if: steps.interval.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OSSLENS_LLM_API_KEY: ${{ secrets.OSSLENS_LLM_API_KEY }}
          OSSLENS_LLM_BASE_URL: ${{ secrets.OSSLENS_LLM_BASE_URL }}
          OSSLENS_AUTO_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from osslens.cli import main
          from osslens.config import Config
          from osslens.pool import evaluate_eligibility, first_auto_slug, load_series
          from osslens.util import SystemClock

          config = Config.load(Path("."))
          series = load_series(config.layout)
          rows = evaluate_eligibility(config, series, as_of=SystemClock().now())
          slug = first_auto_slug(rows, layout=config.layout)
          if slug is None:
              print("[skip] 无候选仓库")
              raise SystemExit(0)
          # 1.2 核心：同一 fast 值用 --auto-chain 标记为「自动链默认档位」，
          #   绝不进入 resolve_depth 的 L4 人工 override —— 通道基线、周次数配额、
          #   周/月/单次 token 预算、调用次数上限、安全系数全部照常生效。
          #   手动 --depth {auto,off,fast,strong} 四档与默认 auto 不受影响（无此标志）。
          code = main(
              ["analyze", slug, "--depth", config.depth.auto_default, "--auto-chain"]
          )
          print(f"analyze {slug} -> exit {code}")
          raise SystemExit(code)
          PY

      - name: 提交本段真源并推送（并行安全：union + 合并后重建站点 + 重试）
        if: steps.interval.outputs.skip != 'true'
        shell: bash
        run: |
          bash scripts/auto_persist.sh "chore(auto): 自动分析 $(date -u +%Y-%m-%d)"

  auto-abstract:
    # 红线 #25：固定 ubuntu-24.04，不用 ubuntu-latest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 抽象段也回写真源（data/costs / data/abstract / patterns / site）；
    # 与 analyze 段并行，互不 needs，由 scripts/auto_persist.sh 做并行安全合并。
    permissions:
      contents: write
    steps:
      - name: 检出
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装 osslens
        run: pip install -e .
      # 独立段：与 auto-analyze 无 needs 依赖，各跑各的（不构成编排器）。
      # 判据沿用「簇内样本达标时触发」：样本不足时 cluster_run 如实产
      # insufficient_samples（0 条 / 0 次 LLM），不伪造条目。
      - name: 频率闸门（schedule 检查抽象真实调用间隔；workflow_dispatch 只绕过间隔）
        id: interval
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from osslens.config import Config
          from osslens.depth import (
              AUTO_ABSTRACT_PURPOSES,
              auto_interval_reached,
              load_events,
          )
          from osslens.util import SystemClock

          config = Config.load(Path("."))
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          reached = auto_interval_reached(
              config,
              load_events(config.layout),
              now=SystemClock().now(),
              purposes=AUTO_ABSTRACT_PURPOSES,
          )
          # ★ 抽象段独立锚点：只统计 purpose ∈ 抽象 run_type 的自动 call，
          #   与分析段互不占用；workflow_dispatch 只绕过间隔，仍受抽象段预算闸门约束。
          if event == "schedule" and not reached:
              print(
                  "[skip] interval not reached"
                  f"（abstract, min_interval_days={config.auto_chain.min_interval_days}）"
              )
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write("skip=true\n")
          else:
              print(f"[gate] event={event} interval_reached={reached}")
          PY

      - name: 独立定时抽象（样本达标判据 / 空态如实 / C1.4 归因）
        if: steps.interval.outputs.skip != 'true'
        env:
          OSSLENS_LLM_API_KEY: ${{ secrets.OSSLENS_LLM_API_KEY }}
          OSSLENS_LLM_BASE_URL: ${{ secrets.OSSLENS_LLM_BASE_URL }}
          OSSLENS_AUTO_RUN_ID: ${{ github.run_id }}
        run: python -m osslens abstract

      # 抽象段的真实调用台账 / run 记录必须回写，否则下次全新检出读不到锚点，
      # 「至少间隔 N 天」会退化成每次 schedule 都真实调用。
      - name: 提交本段真源并推送（并行安全：union + 合并后重建站点 + 重试）
        if: steps.interval.outputs.skip != 'true'
        shell: bash
        run: |
          bash scripts/auto_persist.sh "chore(auto): 规律抽象 $(date -u +%Y-%m-%d)"

  auto-site:
    # 红线 #25：固定 ubuntu-24.04，不用 ubuntu-latest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装 osslens
        run: pip install -e .
      # A2 就绪判据：直接复用 site --check「只比对不写盘，给出差异清单，退出码恒 0」。
      # 上游无新产物时空跑、不写盘、退出码 0，绝不伪造条目（诚实空态，零 LLM / 零网络）。
      - name: 独立定时站点核验（--check --strict：漂移即失败 / 不写盘）
        run: python -m osslens site --check --strict
