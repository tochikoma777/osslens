[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osslens"
version = "0.2.0"
description = "低成本、可长期运行的开源项目深度分析系统（L0：零 LLM 体检）"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "respx>=0.21",
]

[project.scripts]
osslens = "osslens.cli:main"

[tool.setuptools]
packages = ["osslens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "network: 需要真实网络的用例（默认不跳过，离线环境可 -m 'not network'）",
]

[tool.coverage.run]
source = ["osslens"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["osslens", "tests"]
# data/ 存的是「别人的源码切片」与报告，不是本项目的代码 → 不参与 lint
extend-exclude = ["data", "reports", "site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["osslens"]
warn_unreachable = true
show_error_codes = true
